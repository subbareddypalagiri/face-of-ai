<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>UNIN Central Unit — Neural Beam Network</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030303;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .font-hud { font-family: 'Space Grotesk', sans-serif; }
    .font-mono-hud { font-family: 'JetBrains Mono', monospace; }

    /* Node circular styling */
    .neural-node {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      background: #0d0f17;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }
    .neural-node:hover {
      transform: scale(1.1);
      border-color: rgba(0, 240, 255, 0.7);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    .neural-node.active-node {
      border-color: #00f0ff;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.55);
    }

    /* Central Master Nexus */
    .center-nexus {
      width: 104px;
      height: 104px;
      border-radius: 9999px;
      background: radial-gradient(circle at 50% 50%, #151b2e 0%, #060913 100%);
      border: 2px solid rgba(0, 240, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.35), inset 0 0 20px rgba(0, 240, 255, 0.2);
      position: relative;
      cursor: pointer;
      z-index: 30;
      transition: all 0.4s ease;
    }
    .center-nexus:hover {
      transform: scale(1.08);
      box-shadow: 0 0 80px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
    }

    /* Rotating outer halo */
    .nexus-halo {
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      border: 1px dashed rgba(0, 240, 255, 0.35);
      animation: rotateHalo 24s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateHalo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Modal / Detail Drawer */
    .drawer-card {
      background: rgba(10, 15, 28, 0.92);
      backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.15);
    }
  </style>
</head>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveTime').innerText = now.toTimeString().split(' ')[0] + ' UTC';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Exact AnimatedBeam Math Implementation from React Framer Component
    const container = document.getElementById('beamContainer');
    const centerNode = document.getElementById('node-center');
    const pathsGroup = document.getElementById('pathsGroup');

    // Define connection pairs and their beam gradient styling
    const connections = [
      { from: 'node-gdrive', to: 'node-center', grad: 'beamGrad-left1', curvature: 60, reverse: false },
      { from: 'node-notion', to: 'node-center', grad: 'beamGrad-left2', curvature: 0, reverse: false },
      { from: 'node-whatsapp', to: 'node-center', grad: 'beamGrad-left3', curvature: -60, reverse: false },
      { from: 'node-center', to: 'node-gdocs', grad: 'beamGrad-right1', curvature: -60, reverse: false },
      { from: 'node-center', to: 'node-zapier', grad: 'beamGrad-right2', curvature: 0, reverse: false },
      { from: 'node-center', to: 'node-blender', grad: 'beamGrad-right3', curvature: 60, reverse: false },
    ];

    function renderBeams() {
      if (!container || !centerNode) return;
      const cRect = container.getBoundingClientRect();
      pathsGroup.innerHTML = '';

      connections.forEach((conn, index) => {
        const fromEl = document.getElementById(conn.from);
        const toEl = document.getElementById(conn.to);
        if (!fromEl || !toEl) return;

        const rectA = fromEl.getBoundingClientRect();
        const rectB = toEl.getBoundingClientRect();

        const startX = rectA.left - cRect.left + rectA.width / 2;
        const startY = rectA.top - cRect.top + rectA.height / 2;
        const endX = rectB.left - cRect.left + rectB.width / 2;
        const endY = rectB.top - cRect.top + rectB.height / 2;

        // Quadratic bezier with curvature control
        const controlX = (startX + endX) / 2;
        const controlY = ((startY + endY) / 2) - conn.curvature;
        const d = `M ${startX},${startY} Q ${controlX},${controlY} ${endX},${endY}`;

        // 1. Static Dark Base Path
        const basePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        basePath.setAttribute('d', d);
        basePath.setAttribute('stroke', '#1e293b');
        basePath.setAttribute('stroke-width', '2.5');
        basePath.setAttribute('stroke-opacity', '0.45');
        basePath.setAttribute('stroke-linecap', 'round');
        basePath.setAttribute('fill', 'none');
        pathsGroup.appendChild(basePath);

        // 2. Animated Radiant Beam Path
        const beamPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        beamPath.setAttribute('d', d);
        beamPath.setAttribute('stroke', `url(#${conn.grad})`);
        beamPath.setAttribute('stroke-width', '3');
        beamPath.setAttribute('stroke-linecap', 'round');
        beamPath.setAttribute('stroke-opacity', '1');
        beamPath.setAttribute('fill', 'none');
        beamPath.style.filter = 'drop-shadow(0 0 8px rgba(0, 240, 255, 0.4))';
        pathsGroup.appendChild(beamPath);
