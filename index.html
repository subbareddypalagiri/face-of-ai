<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Companion — Smart Memory, ElevenLabs & Real-World Awareness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-solid: #080b10;
      --surface:  #0d1117;
      --border:   rgba(255,255,255,0.07);
      --accent:   #00e5ff;
      --text:     #e8eaf0;
      --muted:    #5a6070;
      --radius:   14px;
      --glow:     0 0 24px rgba(0,229,255,0.18);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'DM Mono', monospace; color: var(--text); }
    body.dark-mode-active { background: var(--bg-solid); }

    #canvas-container { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }
    #canvas-container canvas { position: absolute; left: 0; top: 0; width: 100% !important; height: 100% !important; z-index: 1; pointer-events: auto; background: transparent; display: block; cursor: grab; }
    #canvas-container canvas:active { cursor: grabbing; }
    #fade-overlay { position: fixed; inset: 0; background: var(--bg-solid); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.45s ease; }
    #fade-overlay.active { opacity: 1; }

    #topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; padding: 0 28px; z-index: 20; pointer-events: none; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.08em; color: var(--text); pointer-events: auto; display: flex; align-items: center; gap: 15px;}
    .logo span { color: var(--accent); }

    .theme-btn { background: rgba(13,17,23,0.6); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s; pointer-events: auto; }
    .theme-btn:hover { border-color: var(--accent); color: var(--text); }
    .theme-btn.key-active { border-color: #22c55e; color: #22c55e; }

    .top-menu-btn { display: flex; align-items: center; gap: 8px; padding: 9px 18px 9px 14px; background: rgba(13,17,23,0.85); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); backdrop-filter: blur(12px); transition: all 0.2s; outline: none; pointer-events: auto; }
    .top-menu-btn:hover { border-color: var(--accent); box-shadow: var(--glow); }
    .top-menu-btn .btn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    
    #avatar-toggle-btn { position: fixed; top: 20px; right: 24px; z-index: 30; }
    #voice-toggle-btn { position: fixed; top: 20px; right: 160px; z-index: 30; }
    #voice-toggle-btn .btn-dot { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    .dropdown-menu { position: fixed; width: 300px; z-index: 30; background: rgba(10,13,20,0.92); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(20px); box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden; transform-origin: top right; transform: scale(0.92) translateY(-8px); opacity: 0; pointer-events: none; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s ease; }
    .dropdown-menu.visible { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
    #avatar-menu { top: 70px; right: 24px; }
    #voice-menu { top: 70px; right: 160px; width: 280px; padding: 16px; }

    .control-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; display: flex; justify-content: space-between;}
    .control-group input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .voice-dropdown { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px; outline: none; cursor: pointer; }
    .voice-dropdown option { background: var(--bg-solid); color: var(--text); }
    .mute-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px; transition: 0.2s; }
    .mute-btn.muted { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }

    .menu-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .menu-header h3 { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
    .menu-header .tag { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(0,229,255,0.08); color: var(--accent); border: 1px solid rgba(0,229,255,0.2); }

    .avatar-list { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .avatar-card { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all 0.18s; }
    .avatar-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(0,229,255,0.15); }
    .avatar-card.active { background: rgba(0,229,255,0.06); border-color: rgba(0,229,255,0.3); }
    .avatar-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .avatar-info { flex: 1; min-width: 0; }
    .avatar-name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); }
    .avatar-desc { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #chat-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 750px; padding: 0 20px; z-index: 10; pointer-events: none; height: 80vh; display: flex; flex-direction: column; justify-content: flex-end; }
    .state-selector-bar { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; pointer-events: auto; flex-wrap: wrap; }
    .state-tab { background: rgba(13, 17, 23, 0.7); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; padding: 6px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s; }
    .state-tab:hover { border-color: rgba(0,229,255,0.3); color: var(--text); }
    .state-tab.active { background: var(--accent); color: #000; font-weight: 500; border-color: var(--accent); box-shadow: var(--glow); }

    .chat-box { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: rgba(13, 17, 23, 0.8); border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px 6px 10px; backdrop-filter: blur(16px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); transition: all 0.3s; margin-top: 20px; }
    .chat-box:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
    .chat-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; padding-left: 10px; }
    .chat-input::placeholder { color: var(--muted); }
    .chat-btn { background: var(--accent); color: #000; border: none; border-radius: 50%; width: 36px; height: 36px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .chat-btn:hover { transform: scale(1.05); }
    
    .mic-btn { background: rgba(255,255,255,0.08); color: var(--text); font-size: 14px; border: 1px solid var(--border); }
    .mic-btn:hover { background: rgba(255,255,255,0.15); }
    .mic-btn.listening { background: #ef4444; color: #fff; border-color: #ef4444; animation: pulse 1.2s infinite; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    #status-pill { position: fixed; bottom: 28px; left: 24px; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(13,17,23,0.85); border: 1px solid var(--border); border-radius: 999px; font-size: 11px; color: var(--muted); backdrop-filter: blur(10px); z-index: 20; }
    #status-pill .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    #status-pill.ready .s-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    #status-pill.ready { color: var(--text); }
    #status-pill.loading .s-dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }

    #grid-bg { position: fixed; inset: 0; background-size: 60px 60px; z-index: 1; pointer-events: none; background-image: linear-gradient(rgba(0,229,255,0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.01) 1px, transparent 1px); transition: opacity 0.3s; }
    body.transparent-mode #grid-bg { opacity: 0; }

    #chat-display { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 20px 0; margin-bottom: 16px; padding-right: 8px; pointer-events: auto; }
    #chat-display.hidden { display: none; }
    #chat-display::-webkit-scrollbar { width: 6px; }
    #chat-display::-webkit-scrollbar-track { background: transparent; }
    #chat-display::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); border-radius: 3px; }
    #chat-display::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,0.5); }
    .chat-message { padding: 16px 20px; border-radius: 12px; font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.6; word-wrap: break-word; }
    .chat-message.user { background: rgba(0,229,255,0.12); border-left: 4px solid var(--accent); color: var(--text); }
    .chat-message.companion { background: rgba(7,168,232,0.08); border-left: 4px solid rgba(7,168,232,0.6); color: var(--text); }
    .chat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; display: block; }
    .chat-message.user .chat-label { color: var(--accent); }
    .chat-message.companion .chat-label { color: rgba(7,168,232,0.7); }
  </style>
</head>
<body class="dark-mode-active">

<div id="grid-bg"></div>
<div id="canvas-container"></div>
<div id="fade-overlay"></div>

<div id="topbar">
  <div class="logo">
    AI<span>.</span>Companion
    <button class="theme-btn" onclick="toggleOverlayBackground()">Toggle Bg</button>
    <button id="api-btn" class="theme-btn" onclick="setGeminiAPIKey()">Set Gemini Key</button>
    <button id="eleven-btn" class="theme-btn" onclick="setElevenLabsKey()">Set ElevenLabs Key</button>
  </div>
</div>

<div id="status-pill" class="loading">
  <span class="s-dot"></span>
  <span id="status-text">Initializing...</span>
</div>

<button id="voice-toggle-btn" class="top-menu-btn" onclick="toggleVoiceMenu()">
  <span class="btn-dot"></span>
  <span>Voice Settings</span>
</button>

<div id="voice-menu" class="dropdown-menu">
  <div class="control-group">
    <label>Browser Voice (Fallback)</label>
    <select id="voice-select" class="voice-dropdown" onchange="changeVoice()"></select>
  </div>
  <div class="control-group">
    <label>Speed <span id="speed-val">1.0x</span></label>
    <input type="range" id="voice-speed" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateVoiceSettings()">
  </div>
  <div class="control-group">
    <label>Pitch <span id="pitch-val">1.05</span></label>
    <input type="range" id="voice-pitch" min="0.5" max="2.0" step="0.1" value="1.05" oninput="updateVoiceSettings()">
  </div>
  <button id="mute-btn" class="mute-btn" onclick="toggleMute()">🔊 Mute Audio</button>
</div>

<button id="avatar-toggle-btn" class="top-menu-btn" onclick="toggleMenu()">
  <span class="btn-dot"></span>
  <span id="btn-label">Avatar 1</span>
  <span class="chevron">▾</span>
</button>

<div id="avatar-menu" class="dropdown-menu">
  <div class="menu-header">
    <h3>Select Avatar</h3>
    <span class="tag">Available</span>
  </div>
  <div class="avatar-list" id="avatar-list"></div>
</div>

<div id="chat-container">
  <div id="chat-display" class="hidden">
    <div id="chat-messages-container"></div>
  </div>
  
  <div class="state-selector-bar">
    <button class="state-tab active" id="state-idle" onclick="setAvatarState('idle')">🧘 Idle</button>
    <button class="state-tab" id="state-walk" onclick="setAvatarState('walk')">🚶 Walk</button>
    <button class="state-tab" id="state-run" onclick="setAvatarState('run')">🏃 Run</button>
    <button class="state-tab" id="state-dance" onclick="setAvatarState('dance')">🕺 Dance</button>
    <button class="state-tab" id="state-wave" onclick="setAvatarState('wave')">👋 Wave</button>
  </div>
  
  <div class="chat-box">
    <button id="mic-btn" class="chat-btn mic-btn" title="Click to speak">🎤</button>
    <input type="text" id="user-input" class="chat-input" placeholder="Ask your Gemini companion anything..." autocomplete="off"/>
    <button id="send-btn" class="chat-btn">➔</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';

const lerp = (start, end, amt) => (1 - amt) * start + amt * end;
class AvatarExpressions {
  constructor() {
    this.blinkTimer = 0; this.nextBlinkTime = 2 + Math.random() * 3; this.currentMood = 'neutral'; this.activeGesture = 'neutral';
    this.initialHipsY = null; this.lastVRM = null; this.speechNoiseTime = 0; this.currentVowelType = 0; this.vowelSwitchTimer = 0;
  }
  handleLipSync(vrm, isSpeaking, elapsedTime, delta) {
    if (!vrm || !vrm.expressionManager || vrm.scene.userData?.isPlaceholder) return;
    if (!isSpeaking) { vrm.expressionManager.setValue('aa', 0.0); vrm.expressionManager.setValue('ee', 0.0); vrm.expressionManager.setValue('oh', 0.0); return; }
    let mouthOpen = Math.min(Math.max((Math.sin(elapsedTime * 16.0) * 0.5 + Math.cos(elapsedTime * 8.5) * 0.3 + 0.3), 0.0), 0.75); 
    this.vowelSwitchTimer += delta; if (this.vowelSwitchTimer >= 0.14) { this.currentVowelType = Math.floor(Math.random() * 3); this.vowelSwitchTimer = 0; }
    vrm.expressionManager.setValue('aa', 0.0); vrm.expressionManager.setValue('ee', 0.0); vrm.expressionManager.setValue('oh', 0.0);
    if (this.currentVowelType === 0) vrm.expressionManager.setValue('aa', mouthOpen);
    else if (this.currentVowelType === 1) { vrm.expressionManager.setValue('ee', mouthOpen * 0.5); vrm.expressionManager.setValue('aa', mouthOpen * 0.15); }
    else { vrm.expressionManager.setValue('oh', mouthOpen * 0.7); vrm.expressionManager.setValue('aa', mouthOpen * 0.2); }
  }
  handleAutoBlink(vrm, delta) {
    if (!vrm || !vrm.expressionManager || vrm.scene.userData?.isPlaceholder) return;
    this.blinkTimer += delta;
    if (this.blinkTimer >= this.nextBlinkTime) { vrm.expressionManager.setValue('blink', 1.0); if (this.blinkTimer >= this.nextBlinkTime + 0.12) { vrm.expressionManager.setValue('blink', 0.0); this.blinkTimer = 0; this.nextBlinkTime = 2.5 + Math.random() * 4; } }
  }
  handleLocomotionAndGestures(vrm, state, isSpeaking, elapsedTime, delta) {
    if (!vrm || !vrm.humanoid || vrm.scene.userData?.isPlaceholder) return;
    const bones = { hips: vrm.humanoid.getNormalizedBoneNode('hips'), spine: vrm.humanoid.getNormalizedBoneNode('spine'), neck: vrm.humanoid.getNormalizedBoneNode('neck'), head: vrm.humanoid.getNormalizedBoneNode('head'), leftUpperArm: vrm.humanoid.getNormalizedBoneNode('leftUpperArm'), rightUpperArm: vrm.humanoid.getNormalizedBoneNode('rightUpperArm'), leftLowerArm: vrm.humanoid.getNormalizedBoneNode('leftLowerArm'), rightLowerArm: vrm.humanoid.getNormalizedBoneNode('rightLowerArm'), leftUpperLeg: vrm.humanoid.getNormalizedBoneNode('leftUpperLeg'), rightUpperLeg: vrm.humanoid.getNormalizedBoneNode('rightUpperLeg'), leftLowerLeg: vrm.humanoid.getNormalizedBoneNode('leftLowerLeg'), rightLowerLeg: vrm.humanoid.getNormalizedBoneNode('rightLowerLeg') };
    if (this.lastVRM !== vrm) { this.lastVRM = vrm; this.initialHipsY = bones.hips ? bones.hips.position.y : null; }
    const t = Math.min(delta * 5.0, 1.0); let target = { hipsY: 0.0, hipsRotationZ: 0.0, spineX: 0.0, spineZ: 0.0, headX: 0.0, headY: 0.0, headZ: 0.0, lArmX: 0.0, lArmZ: 1.1, lArmLowerY: 0.0, lArmLowerZ: 0.0, rArmX: 0.0, rArmZ: -1.1, rArmLowerY: 0.0, rArmLowerZ: 0.0, lLegX: 0.0, lLegLowerX: 0.0, rLegX: 0.0, rLegLowerX: 0.0 };
    const waveFast = Math.sin(elapsedTime * 5.5), cosFast = Math.cos(elapsedTime * 5.5); const waveRun = Math.sin(elapsedTime * 8.5), cosRun = Math.cos(elapsedTime * 8.5);
    if (state === 'walk') { target.hipsY = Math.abs(waveFast) * 0.04 - 0.02; target.hipsRotationZ = cosFast * 0.03; target.spineX = 0.04; target.lLegX = waveFast * 0.38; target.rLegX = -waveFast * 0.38; target.lLegLowerX = (cosFast > 0 ? cosFast * 0.25 : 0.0); target.rLegLowerX = (cosFast < 0 ? -cosFast * 0.25 : 0.0); target.lArmX = -waveFast * 0.35 + 0.1; target.lArmZ = 0.2; target.rArmX = waveFast * 0.35 + 0.1; target.rArmZ = -0.2; } else if (state === 'run') { target.hipsY = Math.abs(waveRun) * 0.09 - 0.06; target.hipsRotationZ = cosRun * 0.06; target.spineX = 0.16; target.lLegX = waveRun * 0.65; target.rLegX = -waveRun * 0.65; target.lLegLowerX = (cosRun > 0 ? cosRun * 0.55 : 0.0); target.rLegLowerX = (cosRun < 0 ? -cosRun * 0.55 : 0.0); target.lArmX = -waveRun * 0.6 - 0.2; target.lArmZ = 0.3; target.lArmLowerY = 0.8; target.rArmX = waveRun * 0.6 - 0.2; target.rArmZ = -0.3; target.rArmLowerY = -0.8; } else if (state === 'dance') { target.hipsY = Math.abs(Math.sin(elapsedTime * 4.0)) * 0.06 - 0.03; target.hipsRotationZ = Math.sin(elapsedTime * 3.0) * 0.1; target.spineZ = Math.cos(elapsedTime * 3.0) * 0.1; target.lArmZ = 1.0 + Math.sin(elapsedTime * 5.0) * 0.4; target.lArmX = -0.5 + Math.cos(elapsedTime * 4.0) * 0.3; target.rArmZ = -1.0 - Math.cos(elapsedTime * 5.0) * 0.4; target.rArmX = -0.5 + Math.sin(elapsedTime * 4.0) * 0.3; target.lLegX = Math.sin(elapsedTime * 3.0) * 0.2; target.rLegX = -Math.sin(elapsedTime * 3.0) * 0.2; } else if (state === 'wave') { target.lArmZ = 1.1; target.rArmX = -0.2; target.rArmZ = -1.2 + Math.sin(elapsedTime * 12.0) * 0.3; target.rArmLowerZ = -0.5; } else { target.spineX = Math.sin(elapsedTime * 1.8) * 0.02; target.spineZ = Math.cos(elapsedTime * 0.9) * 0.01; target.headY = Math.cos(elapsedTime * 0.9) * 0.03; target.lArmZ = 1.1; target.rArmZ = -1.1; }
    if (isSpeaking && state !== 'dance' && state !== 'wave') { const talkWave1 = Math.sin(elapsedTime * 4.0); const talkWave2 = Math.cos(elapsedTime * 2.3); if (this.activeGesture === 'greeting') { target.rArmX = lerp(target.rArmX, -0.2, 0.8); target.rArmZ = lerp(target.rArmZ, -1.2 + Math.sin(elapsedTime * 12.0) * 0.3, 0.8); target.rArmLowerZ = lerp(target.rArmLowerZ, -0.5, 0.8); } else if (this.activeGesture === 'thinking') { target.rArmX = lerp(target.rArmX, -1.2, 0.8); target.rArmZ = lerp(target.rArmZ, -0.2, 0.8); target.rArmLowerZ = lerp(target.rArmLowerZ, -1.5, 0.8); target.rArmLowerY = lerp(target.rArmLowerY, -0.5, 0.8); target.headZ = lerp(target.headZ, 0.15, 0.8); target.headX = lerp(target.headX, 0.05, 0.8); } else if (this.activeGesture === 'celebrating') { target.lArmX = lerp(target.lArmX, -0.5, 0.8); target.lArmZ = lerp(target.lArmZ, 1.4 + talkWave1 * 0.1, 0.8); target.rArmX = lerp(target.rArmX, -0.5, 0.8); target.rArmZ = lerp(target.rArmZ, -1.4 + talkWave2 * 0.1, 0.8); } else { target.lArmX = lerp(target.lArmX, -0.2 + talkWave1 * 0.15, 0.7); target.lArmZ = lerp(target.lArmZ, 0.6 + talkWave2 * 0.1, 0.7); target.lArmLowerY = lerp(target.lArmLowerY, 0.5 + talkWave1 * 0.2, 0.7); target.rArmX = lerp(target.rArmX, -0.2 + talkWave2 * 0.15, 0.7); target.rArmZ = lerp(target.rArmZ, -0.6 - talkWave1 * 0.1, 0.7); target.rArmLowerY = lerp(target.rArmLowerY, -0.5 - talkWave2 * 0.2, 0.7); } }
    if (bones.hips && this.initialHipsY !== null) { bones.hips.position.y = lerp(bones.hips.position.y, this.initialHipsY + target.hipsY, t); bones.hips.rotation.z = lerp(bones.hips.rotation.z, target.hipsRotationZ, t); } if (bones.spine) { bones.spine.rotation.x = lerp(bones.spine.rotation.x, target.spineX, t); bones.spine.rotation.z = lerp(bones.spine.rotation.z, target.spineZ, t); } if (bones.neck) bones.neck.rotation.y = lerp(bones.neck.rotation.y, target.headY, t); if (bones.head) { bones.head.rotation.x = lerp(bones.head.rotation.x, target.headX, t); bones.head.rotation.z = lerp(bones.head.rotation.z, target.headZ, t); } if (bones.leftUpperArm) { bones.leftUpperArm.rotation.x = lerp(bones.leftUpperArm.rotation.x, target.lArmX, t); bones.leftUpperArm.rotation.z = lerp(bones.leftUpperArm.rotation.z, target.lArmZ, t); } if (bones.leftLowerArm) { bones.leftLowerArm.rotation.y = lerp(bones.leftLowerArm.rotation.y, target.lArmLowerY, t); bones.leftLowerArm.rotation.z = lerp(bones.leftLowerArm.rotation.z, target.lArmLowerZ, t); } if (bones.rightUpperArm) { bones.rightUpperArm.rotation.x = lerp(bones.rightUpperArm.rotation.x, target.rArmX, t); bones.rightUpperArm.rotation.z = lerp(bones.rightUpperArm.rotation.z, target.rArmZ, t); } if (bones.rightLowerArm) { bones.rightLowerArm.rotation.y = lerp(bones.rightLowerArm.rotation.y, target.rArmLowerY, t); bones.rightLowerArm.rotation.z = lerp(bones.rightLowerArm.rotation.z, target.rArmLowerZ, t); } if (bones.leftUpperLeg) bones.leftUpperLeg.rotation.x = lerp(bones.leftUpperLeg.rotation.x, target.lLegX, t); if (bones.leftLowerLeg) bones.leftLowerLeg.rotation.x = lerp(bones.leftLowerLeg.rotation.x, target.lLegLowerX, t); if (bones.rightUpperLeg) bones.rightUpperLeg.rotation.x = lerp(bones.rightUpperLeg.rotation.x, target.rLegX, t); if (bones.rightLowerLeg) bones.rightLowerLeg.rotation.x = lerp(bones.rightLowerLeg.rotation.x, target.rLegLowerX, t);
  }
  analyzeTextAndSetMood(vrm, text) {
    if (!vrm || !vrm.expressionManager || vrm.scene.userData?.isPlaceholder) return; const lowerText = text.toLowerCase(); const standardMoods = ['happy', 'sad', 'angry', 'relaxed', 'surprised']; standardMoods.forEach(m => vrm.expressionManager.setValue(m, 0.0));
    if (lowerText.includes('sorry') || lowerText.includes('error') || lowerText.includes('failed')) { vrm.expressionManager.setValue('sad', 0.7); this.currentMood = 'sad'; } else if (lowerText.includes('wow') || lowerText.includes('amazing')) { vrm.expressionManager.setValue('surprised', 0.6); this.currentMood = 'surprised'; } else if (lowerText.includes('hello') || lowerText.includes('happy') || lowerText.includes('super')) { vrm.expressionManager.setValue('happy', 0.8); this.currentMood = 'happy'; } else { vrm.expressionManager.setValue('relaxed', 0.5); this.currentMood = 'relaxed'; }
    if (lowerText.includes('hello') || lowerText.includes('hi ') || lowerText.includes('welcome')) this.activeGesture = 'greeting'; else if (lowerText.includes('solve') || lowerText.includes('think') || lowerText.includes('question')) this.activeGesture = 'thinking'; else if (lowerText.includes('super') || lowerText.includes('wow') || lowerText.includes('amazing')) this.activeGesture = 'celebrating'; else if (lowerText.includes('code') || lowerText.includes('step') || lowerText.includes('easy')) this.activeGesture = 'explaining'; else this.activeGesture = 'neutral';
  }
  resetMood(vrm) { if (!vrm || !vrm.expressionManager) return; const standardMoods = ['happy', 'sad', 'angry', 'relaxed', 'surprised']; standardMoods.forEach(m => vrm.expressionManager.setValue(m, 0.0)); vrm.expressionManager.setValue('relaxed', 0.3); this.activeGesture = 'neutral'; }
}
const expressions = new AvatarExpressions();

const AVATARS = [
  { id: 0, name: 'Avatar 1', desc: 'Default companion · Neutral', icon: '🤖', color: '#00e5ff', path: './avatar.vrm' },
  { id: 1, name: 'Avatar 2', desc: 'New Character · Cool', icon: '😎', color: '#39ff14', path: './avatar2.vrm' },
  { id: 2, name: 'Avatar 3', desc: 'Guide · Professional', icon: '🧬', color: '#f59e0b', path: './avatar3.vrm' }
];

let currentAvatarIndex = 0; let currentVRM = null; let isTransitioning = false; let isSpeaking = false; let currentLocomotionState = 'idle'; let chatHistory = [];
let availableVoices = []; let selectedVoice = null; let currentVoiceSpeed = 1.0; let currentVoicePitch = 1.05; let isVoiceMuted = false; let currentAudio = null; 

const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20.0);
camera.position.set(0.0, 1.2, 5.0); camera.lookAt(0.0, 1.2, 0); 
const light = new THREE.DirectionalLight(0xffffff, Math.PI); light.position.set(1.0, 1.0, 1.0).normalize(); scene.add(light);
const lookAtTarget = new THREE.Object3D(); scene.add(lookAtTarget);

const loader = new GLTFLoader(); loader.register(parser => new VRMLoaderPlugin(parser));

async function loadVRM(path) { return new Promise((resolve, reject) => { loader.load(path, gltf => { resolve(gltf.userData.vrm); }, xhr => { if(xhr.total > 0) setStatus(`Loading… ${Math.round((xhr.loaded / xhr.total) * 100)}%`, 'loading'); }, reject); }); }
function mountVRM(vrm) { vrm.scene.rotation.y = Math.PI; vrm.scene.position.y = -0.15; vrm.scene.position.x = 0.0; vrm.lookAt.target = lookAtTarget; scene.add(vrm.scene); currentVRM = vrm; }
function unmountCurrent() { if (!currentVRM) return; scene.remove(currentVRM.scene); currentVRM = null; }

let isDragging = false; let previousMousePosition = { x: 0, y: 0 };
window.addEventListener('pointerdown', (e) => { if (e.target.tagName === 'CANVAS') { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; }});
window.addEventListener('pointermove', (e) => { lookAtTarget.position.set(2.0 * (e.clientX / window.innerWidth) - 1.0, -2.0 * (e.clientY / window.innerHeight) + 1.0, 2.0); if (isDragging && currentVRM) { currentVRM.scene.position.x += (e.clientX - previousMousePosition.x) * 0.005; currentVRM.scene.position.y -= (e.clientY - previousMousePosition.y) * 0.005; previousMousePosition = { x: e.clientX, y: e.clientY }; }});
window.addEventListener('pointerup', () => { isDragging = false; });

async function getAIResponse(promptText) {
  setStatus('AI Thinking...', 'loading'); const savedKey = localStorage.getItem('gemini_companion_key');
  if (!savedKey) { setStatus('Gemini Key Missing', 'loading'); return "Buddy, top bar lo 'Set Gemini Key' button press chesi nee API key ni pettu."; }
  chatHistory.push({ role: 'user', parts: [{ text: promptText }] });
  
  // 🔥 NEW: Real-World Context Injection 🔥
  const liveDate = new Date().toLocaleString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const aiSystemPrompt = `You are LS01, a highly friendly AI companion. You must talk in Roman Telugu (Tinglish) using a casual, close-friend buddy tone. Rules:\n1. Always address the user as 'buddy' or 'are buddy'.\n2. If the user asks a question, coding task, or a problem to solve, you MUST absolutely start your response with the phrase: 'Are buddy ee question ni manam easy ga solve cheyavacchu' or something very close to it in a confident friend tone.\n3. If the user shares an idea, project plan, suggestion, or thoughts, you MUST start your response with the phrase: 'Buddy mee idea chala super ga vundi!' or identical praise before expanding on it.\n4. Keep your responses short, conversational, warm, and within 2 sentences maximum.\n\n🌍 LIVE AWARENESS: The user's current live time is ${liveDate}. If appropriate, naturally reference the time of day in your reply.`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${savedKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: chatHistory, systemInstruction: { parts: [{ text: aiSystemPrompt }] } })
    });
    if (!response.ok) throw new Error('API Execution Failed'); const data = await response.json(); const aiAnswer = data.candidates[0].content.parts[0].text; chatHistory.push({ role: 'model', parts: [{ text: aiAnswer }] }); return aiAnswer;
  } catch(e) { chatHistory.pop(); return "Arere buddy, Gemini API request error vachindi. Key correct ena check chesko."; }
}

function initVoices() {
  availableVoices = window.speechSynthesis.getVoices(); const voiceSelect = document.getElementById('voice-select'); voiceSelect.innerHTML = ''; let defaultSet = false;
  availableVoices.forEach((voice, i) => { const option = document.createElement('option'); option.textContent = `${voice.name} (${voice.lang})`; option.value = i; if (!defaultSet && (voice.lang === 'en-IN' || voice.name.toLowerCase().includes('india'))) { option.selected = true; selectedVoice = voice; defaultSet = true; } voiceSelect.appendChild(option); });
  if(!defaultSet && availableVoices.length > 0) selectedVoice = availableVoices[0];
}
if (typeof window.speechSynthesis !== 'undefined') window.speechSynthesis.onvoiceschanged = initVoices; setTimeout(initVoices, 500);
window.changeVoice = function() { const voiceSelect = document.getElementById('voice-select'); selectedVoice = availableVoices[voiceSelect.value]; };

async function speakText(text) {
  window.speechSynthesis.cancel(); if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if(isVoiceMuted) { setStatus('Companion Ready', 'ready'); if (currentVRM && expressions.resetMood) expressions.resetMood(currentVRM); return; }
  const elevenKey = localStorage.getItem('elevenlabs_companion_key');
  if (elevenKey) {
    const voiceId = localStorage.getItem('elevenlabs_voice_id') || '21m00Tcm4TlvDq8ikWAM'; setStatus('Generating Audio...', 'loading');
    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, { method: 'POST', headers: { 'Accept': 'audio/mpeg', 'Content-Type': 'application/json', 'xi-api-key': elevenKey }, body: JSON.stringify({ text: text, model_id: "eleven_monolingual_v1", voice_settings: { stability: 0.5, similarity_boost: 0.5 } }) });
      if (!response.ok) throw new Error("ElevenLabs API failed");
      const blob = await response.blob(); const audioUrl = URL.createObjectURL(blob); currentAudio = new Audio(audioUrl);
      currentAudio.onplay = () => { isSpeaking = true; setStatus('Speaking...', 'loading'); }; currentAudio.onended = () => { isSpeaking = false; setStatus('Companion Ready', 'ready'); if (currentVRM && expressions.resetMood) expressions.resetMood(currentVRM); };
      currentAudio.play(); return; 
    } catch(e) { console.error("ElevenLabs Fallback Initiated:", e); }
  }
  const utterance = new SpeechSynthesisUtterance(text); if (selectedVoice) utterance.voice = selectedVoice; utterance.pitch = currentVoicePitch; utterance.rate = currentVoiceSpeed;  
  utterance.onstart = () => { isSpeaking = true; setStatus('Speaking...', 'loading'); }; utterance.onend = () => { isSpeaking = false; setStatus('Companion Ready', 'ready'); if (currentVRM && expressions.resetMood) expressions.resetMood(currentVRM); }; window.speechSynthesis.speak(utterance);
}

// 🎤 VOICE INPUT (MIC) LOGIC
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('mic-btn');
const userInput = document.getElementById('user-input');
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition(); recognition.continuous = false; recognition.interimResults = false;
  recognition.onstart = () => { micBtn.classList.add('listening'); userInput.placeholder = "Listening... Speak now buddy!"; };
  recognition.onresult = (event) => { const transcript = event.results[0][0].transcript; userInput.value = transcript; setTimeout(handleUserMessage, 300); };
  recognition.onerror = (e) => { micBtn.classList.remove('listening'); userInput.placeholder = "Ask your Gemini companion anything..."; };
  recognition.onend = () => { micBtn.classList.remove('listening'); userInput.placeholder = "Ask your Gemini companion anything..."; };
  micBtn.addEventListener('click', () => { recognition.start(); });
} else { micBtn.style.display = 'none'; console.warn("Speech Recognition not supported in this browser."); }

async function handleUserMessage() {
  const input = document.getElementById('user-input'); const message = input.value.trim(); if (!message) return;
  input.value = ''; input.disabled = true;
  const chatDisplay = document.getElementById('chat-display'); const messagesContainer = document.getElementById('chat-messages-container'); chatDisplay.classList.remove('hidden');
  const userMsgEl = document.createElement('div'); userMsgEl.className = 'chat-message user'; userMsgEl.innerHTML = '<span class="chat-label">You</span>' + message; messagesContainer.appendChild(userMsgEl); chatDisplay.scrollTop = chatDisplay.scrollHeight;
  const aiAnswer = await getAIResponse(message); input.disabled = false; input.focus();
  const aiMsgEl = document.createElement('div'); aiMsgEl.className = 'chat-message companion'; aiMsgEl.innerHTML = '<span class="chat-label">Companion Response</span>' + aiAnswer; messagesContainer.appendChild(aiMsgEl); chatDisplay.scrollTop = chatDisplay.scrollHeight;
  if (currentVRM) expressions.analyzeTextAndSetMood(currentVRM, aiAnswer); speakText(aiAnswer);
}

document.getElementById('send-btn').addEventListener('click', handleUserMessage);
document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserMessage(); });

window.setAvatarState = function(stateName) { currentLocomotionState = stateName; document.querySelectorAll('.state-tab').forEach(tab => tab.classList.remove('active')); document.getElementById(`state-${stateName}`).classList.add('active'); };
window.toggleOverlayBackground = function() { document.body.classList.toggle('dark-mode-active'); document.body.classList.toggle('transparent-mode'); };

window.setGeminiAPIKey = function() { const userKey = prompt("Nee Gemini API Key ni ikkada paste chey buddy:"); if (userKey && userKey.trim()) { localStorage.setItem('gemini_companion_key', userKey.trim()); checkSavedKeysUI(); setStatus('Gemini Key Saved', 'ready'); } };
window.setElevenLabsKey = function() { const userKey = prompt("Nee ElevenLabs API Key ni ikkada paste chey buddy:"); if (userKey && userKey.trim()) { localStorage.setItem('elevenlabs_companion_key', userKey.trim()); const voiceId = prompt("Voice ID enter chey buddy (Vadhilesunte 'Rachel' vasthundi):", "21m00Tcm4TlvDq8ikWAM"); if (voiceId && voiceId.trim()) { localStorage.setItem('elevenlabs_voice_id', voiceId.trim()); } checkSavedKeysUI(); setStatus('ElevenLabs Key Saved', 'ready'); } };

function checkSavedKeysUI() { if (localStorage.getItem('gemini_companion_key')) { document.getElementById('api-btn').classList.add('key-active'); document.getElementById('api-btn').textContent = "Gemini Active"; } if (localStorage.getItem('elevenlabs_companion_key')) { document.getElementById('eleven-btn').classList.add('key-active'); document.getElementById('eleven-btn').textContent = "ElevenLabs Active"; } } checkSavedKeysUI();
window.toggleMenu = function() { document.getElementById('voice-menu').classList.remove('visible'); document.getElementById('avatar-menu').classList.toggle('visible'); }; window.toggleVoiceMenu = function() { document.getElementById('avatar-menu').classList.remove('visible'); document.getElementById('voice-menu').classList.toggle('visible'); };
window.updateVoiceSettings = function() { currentVoiceSpeed = parseFloat(document.getElementById('voice-speed').value); currentVoicePitch = parseFloat(document.getElementById('voice-pitch').value); document.getElementById('speed-val').textContent = currentVoiceSpeed.toFixed(1) + "x"; document.getElementById('pitch-val').textContent = currentVoicePitch.toFixed(2); };
window.toggleMute = function() { isVoiceMuted = !isVoiceMuted; const btn = document.getElementById('mute-btn'); if(isVoiceMuted) { btn.classList.add('muted'); btn.textContent = "🔇 Audio Muted"; window.speechSynthesis.cancel(); if(currentAudio) currentAudio.pause(); isSpeaking = false; } else { btn.classList.remove('muted'); btn.textContent = "🔊 Mute Audio"; } };

window.switchAvatar = async function(index) { if (index === currentAvatarIndex && currentVRM) return; if (isTransitioning) return; isTransitioning = true; document.getElementById('avatar-menu').classList.remove('visible'); const fadeEl = document.getElementById('fade-overlay'); fadeEl.classList.add('active'); await new Promise(res => setTimeout(res, 480)); unmountCurrent(); try { const vrm = await loadVRM(AVATARS[index].path); mountVRM(vrm); currentAvatarIndex = index; fadeEl.classList.remove('active'); setStatus(`${AVATARS[index].name} active`, 'ready'); document.getElementById('btn-label').textContent = AVATARS[index].name; updateCards(index); } catch (err) { fadeEl.classList.remove('active'); showPlaceholder(index); } isTransitioning = false; };
function showPlaceholder(index) { const geo = new THREE.BoxGeometry(0.5, 1.4, 0.3); const mat = new THREE.MeshBasicMaterial({ color: AVATARS[index].color, wireframe: true }); const mesh = new THREE.Mesh(geo, mat); mesh.position.set(0, 0.7, 0); currentVRM = { scene: (() => { const g = new THREE.Group(); g.add(mesh); g.userData = { isPlaceholder: true }; return g; })(), update: () => {} }; scene.add(currentVRM.scene); currentAvatarIndex = index; document.getElementById('btn-label').textContent = AVATARS[index].name + ' ⚠'; setStatus(`${AVATARS[index].name} — file not found`, 'ready'); }

const clock = new THREE.Clock();
function animate() { requestAnimationFrame(animate); const delta = clock.getDelta(); if (currentVRM) { currentVRM.update(delta); expressions.handleLipSync(currentVRM, isSpeaking, clock.getElapsedTime(), delta); expressions.handleAutoBlink(currentVRM, delta); expressions.handleLocomotionAndGestures(currentVRM, currentLocomotionState, isSpeaking, clock.getElapsedTime(), delta); } camera.lookAt(0.0, 1.2, 0); renderer.render(scene, camera); } animate();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
function setStatus(msg, state) { const pill = document.getElementById('status-pill'); if (!pill) return; const txt  = document.getElementById('status-text'); txt.textContent = msg; pill.className = ''; if (state) pill.classList.add(state); }
function updateCards(activeIdx) { document.querySelectorAll('.avatar-card').forEach((card, i) => { card.classList.toggle('active', i === activeIdx); }); }

const listEl = document.getElementById('avatar-list'); AVATARS.forEach((av, i) => { const card = document.createElement('div'); card.className = 'avatar-card' + (i === 0 ? ' active' : ''); card.innerHTML = `<div class="avatar-icon" style="background:${av.color}18;">${av.icon}</div><div class="avatar-info"><div class="avatar-name">${av.name}</div><div class="avatar-desc">${av.desc}</div></div><span class="avatar-badge ${i === 0 ? 'badge-active' : 'badge-idle'}">${i === 0 ? 'ACTIVE' : 'IDLE'}</span>`; card.addEventListener('click', () => switchAvatar(i)); listEl.appendChild(card); });

setStatus('Loading Avatar 1…', 'loading');
loadVRM(AVATARS[0].path).then(vrm => { mountVRM(vrm); setStatus('Companion Ready', 'ready'); updateCards(0); setTimeout(() => { speakText("Welcome back buddy! Neural network online lock aindi. Eeroju em help cheyali cheppu?"); }, 1500); }).catch(err => { showPlaceholder(0); });
